[package]
name = "pot-gtk"
version = "1.0.2"
description = "Pot - GTK4 native translation and OCR desktop application"
authors = ["pot-app"]
license = "GPL-3.0-only"
edition = "2021"

[features]
default = ["tts", "ocr", "hotkey"]
tts = ["gstreamer", "gstreamer-app"]
ocr = ["lingua"]
hotkey = ["x11rb", "ashpd", "zbus", "futures-util", "evdev"]
plugin = ["boa_engine"]
tray = ["ksni", "futures"]

[dependencies]
# GTK4 / libadwaita / relm4
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_5"] }
relm4 = { version = "0.9", features = ["libadwaita", "gnome_45"] }
relm4-components = "0.9"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
tiny_http = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Image
image = "0.25"
base64 = "0.22"

# Clipboard
arboard = "3.4"

# Screenshot
screenshots = "0.7"

# Language detection (optional - needed for OCR)
lingua = { version = "1.6", default-features = false, optional = true, features = [
    "chinese", "japanese", "english", "korean", "french", "spanish",
    "german", "russian", "italian", "portuguese", "turkish", "arabic",
    "vietnamese", "thai", "indonesian", "malay", "hindi", "mongolian",
    "persian", "nynorsk", "bokmal", "ukrainian",
] }

# Archive
zip = "2"

# System
dirs = "5"
font-kit = "0.14"
mouse_position = "0.1"
selection = "1.2"

# Crypto (for API signing)
md-5 = "0.10"
sha2 = "0.10"

# Plugin JS runtime (optional)
boa_engine = { version = "0.19", optional = true }

# Audio (optional - Phase 4)
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }

# i18n
gettext-rs = "0.7"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "1"
keyring = "2.3.3"

# Random
getrandom = "0.3"

# X11 global shortcuts (optional - Phase 2)
x11rb = { version = "0.13", optional = true }

# Wayland global shortcuts via xdg-desktop-portal (optional)
ashpd = { version = "0.11", optional = true }
zbus = { version = "5", optional = true }
futures-util = { version = "0.3", optional = true }
evdev = { version = "0.13", optional = true }
urlencoding = "2.1.3"

# System tray (optional)
ksni = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "pot-app <pot-app@github.com>"
copyright = "2024, pot-app"
depends = "$auto, libgtk-4-1, libadwaita-1-0"
recommends = "gstreamer1.0-plugins-base, gstreamer1.0-plugins-good"
section = "utility"
priority = "optional"
assets = [
    ["target/release/pot-gtk", "usr/bin/", "755"],
    ["data/com.pot-app.pot-gtk.desktop", "usr/share/applications/", "644"],
    ["data/com.pot-app.pot-gtk.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/scalable/apps/com.pot-app.pot-gtk.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/128x128/apps/com.pot-app.pot-gtk.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/64x64/apps/com.pot-app.pot-gtk.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/48x48/apps/com.pot-app.pot-gtk.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/32x32/apps/com.pot-app.pot-gtk.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/16x16/apps/com.pot-app.pot-gtk.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["target/pot-gtk.mo/**/*", "usr/share/locale/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pot-gtk", dest = "/usr/bin/pot-gtk", mode = "755" },
    { source = "data/com.pot-app.pot-gtk.desktop", dest = "/usr/share/applications/com.pot-app.pot-gtk.desktop", mode = "644" },
    { source = "data/com.pot-app.pot-gtk.metainfo.xml", dest = "/usr/share/metainfo/com.pot-app.pot-gtk.metainfo.xml", mode = "644" },
    { source = "data/icons/scalable/apps/com.pot-app.pot-gtk.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.pot-app.pot-gtk.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gstreamer1 = "*"
